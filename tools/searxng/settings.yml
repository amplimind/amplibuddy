# SearXNG for Ampli's internet café: a local meta search (Google, Bing, DuckDuckGo, …)
# over your own connection. No account, no key. Started with `npm run search:start`,
# reachable only from this machine (127.0.0.1:8888). The secret key comes from the
# SEARXNG_SECRET env var set by that script.
use_default_settings: true
server:
  limiter: false
  image_proxy: false
outgoing:
  # Engines get a bit more time than the default 3 s before they count as failed.
  request_timeout: 6.0
  max_request_timeout: 10.0
search:
  safe_search: 1
  formats:
    - html
    - json
